name: Export H5P to SCORM

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run SCORM export
        run: npm run build

      - name: Upload SCORM package
        uses: actions/upload-artifact@v4
        with:
          name: scorm-package
          path: output.zip
